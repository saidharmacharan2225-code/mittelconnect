name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system ODBC headers for pyodbc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unixodbc-dev
      - run: pip install -r requirements.txt
      - run: python -m compileall -q core main.py mock_sap scripts/sandbox.py
      - run: python -m unittest discover -s tests -t . -v

  go:
    name: Go monitor
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: monitor/go.mod
          cache-dependency-path: monitor/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null .

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh sandbox/mssql/*.sh

  terraform:
    name: Terraform (Hetzner)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: deploy/hetzner
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    name: Build and scan images
    runs-on: ubuntu-24.04
    needs: [python, go]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build middleware image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mittelconnect:ci
          cache-from: type=gha,scope=middleware
          cache-to: type=gha,mode=max,scope=middleware
      - name: Build monitor image
        uses: docker/build-push-action@v6
        with:
          context: monitor
          load: true
          tags: mittelconnect-monitor:ci
          cache-from: type=gha,scope=monitor
          cache-to: type=gha,mode=max,scope=monitor
      - name: Smoke test middleware image
        run: |
          docker run --rm --network none mittelconnect:ci --version
          docker run --rm --network none --entrypoint python mittelconnect:ci -c "import pyodbc, oracledb; print(pyodbc.drivers())" | grep -q "ODBC Driver 18 for SQL Server"
      - name: Smoke test monitor image
        run: docker run --rm --network none mittelconnect-monitor:ci -help 2>&1 | grep -q -- "-healthcheck"
      - name: Install Trivy from Aqua Security's signed apt repository
        run: |
          sudo apt-get install -y --no-install-recommends wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy
          trivy --version
      - name: Scan images (fixable HIGH/CRITICAL fail the build)
        run: |
          for image in mittelconnect:ci mittelconnect-monitor:ci; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image"
          done

  sandbox-drill:
    name: Sandbox outage drill
    runs-on: ubuntu-24.04
    needs: [python, go]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap secrets and build the middleware image
        run: bash scripts/bootstrap_sandbox.sh
      - name: Start the sandbox with the monitor and wait for a healthy middleware
        run: |
          docker compose -f docker-compose.yml -f docker-compose.monitor.yml up -d --build
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q middleware)" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "middleware did not become healthy" >&2
          exit 1
      - name: Outage drill (60 s SAP outage)
        run: bash scripts/outage_drill.sh 60
      - name: Monitor reports an empty outbox
        run: curl -fsS http://127.0.0.1:9464/metrics | grep -E '^mittelconnect_outbox_records\{.*\} 0$'
      - name: No duplicate deliveries to SAP
        run: |
          docker compose exec -T mock-sap python3 -c "
          import collections, json, sys
          rows = [json.loads(line) for line in open('/data/received.jsonl')]
          keys = collections.Counter((r['Material'], r['Plant'], r['StorageLocation'], r['YY1_ChangedAt_MMD']) for r in rows)
          dupes = sum(1 for n in keys.values() if n > 1)
          print(f'{dupes} duplicates in {len(rows)} records')
          sys.exit(1 if dupes else 0)
          "
      - name: Sandbox logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.monitor.yml logs --no-color --tail 200 || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.monitor.yml down -v || true

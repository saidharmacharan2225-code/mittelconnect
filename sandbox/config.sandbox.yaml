# =============================================================================
# Sandbox configuration: mock SQL Server + mock SAP gateway inside Docker.
# Mounted over /app/config/config.yaml by docker-compose.yml.
# Secrets arrive as ENC[...] environment values generated by
# scripts/bootstrap_sandbox.sh; the master key comes from a Docker secret.
# =============================================================================

service:
  instance_name: "sandbox-werk-01"
  poll_interval_seconds: 20
  cycle_timeout_seconds: 600
  heartbeat_file: "${MC_HEARTBEAT_FILE:-/app/data/heartbeat}"
  shutdown_grace_seconds: 20

logging:
  level: "${MC_LOG_LEVEL:-INFO}"
  format: "${MC_LOG_FORMAT:-json}"
  file: ""

security:
  master_key_env: "MITTELCONNECT_MASTER_KEY"
  master_key_file: "${MC_MASTER_KEY_FILE:-/run/secrets/mittelconnect_master.key}"
  pseudonymization_key: "${MC_PSEUDONYMIZATION_KEY}"
  encrypt_outbox: true
  allowed_host_suffixes:
    - "mock-sap"

cache:
  sqlite_path: "${MC_CACHE_PATH:-/app/data/mittelconnect_cache.db}"
  max_replay_attempts: 50
  replay_batch_limit: 200
  replay_base_delay_seconds: 5
  replay_max_delay_seconds: 60
  dead_letter_retention_days: 30
  extract_while_sap_down: true
  max_outbox_records: 100000

databases:
  erp_legacy_mssql:
    type: "mssql"
    driver: "ODBC Driver 18 for SQL Server"
    host: "mssql"
    port: 1433
    database: "PRODUKTION"
    username: "mc_reader"
    password: "${MC_MSSQL_PASSWORD}"
    encrypt: true
    # The SQL Server container uses a self-signed certificate.
    trust_server_certificate: true
    login_timeout_seconds: 15
    query_timeout_seconds: 120
    legacy_encoding: "cp1252"
    connect_retries: 10
    connect_base_delay_seconds: 2
    connect_max_delay_seconds: 30

sap:
  base_url: "http://mock-sap:8080"
  sap_client: "100"
  auth_mode: "oauth2"
  oauth2:
    token_url: "http://mock-sap:8080/sap/bc/sec/oauth2/token"
    client_id: "MITTELCONNECT"
    client_secret: "${MC_SAP_CLIENT_SECRET}"
    scope: ""
    refresh_skew_seconds: 30
  tls:
    verify: true
    ca_bundle: ""
    client_cert: ""
    client_key: ""
  # The mock gateway speaks plain HTTP on the internal Docker network only.
  allow_insecure_http: true
  timeouts:
    connect_seconds: 5
    read_seconds: 30
    write_seconds: 30
    pool_seconds: 5
  max_connections: 5
  batch_size: 50
  atomic_batches: false
  retry:
    max_attempts: 3
    base_delay_seconds: 1
    max_delay_seconds: 8
  circuit_breaker:
    failure_threshold: 3
    recovery_timeout_seconds: 30

jobs:
  - name: "material_stock_sync"
    enabled: true
    source: "erp_legacy_mssql"
    chunk_size: 200
    source_timezone: "Europe/Berlin"
    watermark_column: "LastChanged"
    initial_watermark: "2000-01-01T00:00:00"
    query: >
      SELECT ArtikelNr, Bezeichnung, Werk, Lagerort, Bestand, Mengeneinheit,
             LetzterBearbeiter, LastChanged
      FROM dbo.Lagerbestand WITH (NOLOCK)
      WHERE LastChanged > :watermark
      ORDER BY LastChanged ASC
    sap:
      service_path: "/sap/opu/odata/sap/API_MATERIAL_STOCK_SRV"
      entity_set: "A_MatlStkInAcctMod"
    mapping:
      Material:
        source: "ArtikelNr"
        type: "string"
        max_length: 40
        required: true
        upper: true
      MaterialDescription:
        source: "Bezeichnung"
        type: "string"
        max_length: 40
      Plant:
        source: "Werk"
        type: "string"
        max_length: 4
        required: true
      StorageLocation:
        source: "Lagerort"
        type: "string"
        max_length: 4
      MatlWrhsStkQtyInMatlBaseUnit:
        source: "Bestand"
        type: "decimal"
        scale: 3
        required: true
      MaterialBaseUnit:
        source: "Mengeneinheit"
        type: "string"
        max_length: 3
        value_map:
          STK: "ST"
          KG: "KG"
          M: "M"
      YY1_LastEditor_MMD:
        source: "LetzterBearbeiter"
        type: "string"
        pseudonymize: true
      YY1_ChangedAt_MMD:
        source: "LastChanged"
        type: "datetime"
      YY1_SourceSystem_MMD:
        type: "constant"
        value: "LEGACY_MSSQL"

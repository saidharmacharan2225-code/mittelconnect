# Prometheus configuration for a monitoring server attached to the Hetzner
# private network (terraform output private_network_id). One target per site
# (terraform output sites[*].metrics_target).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/mittelconnect-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: mittelconnect
    metrics_path: /metrics
    static_configs:
      - targets: ["10.42.1.11:9464"]
        labels:
          customer: "mueller-werk-01"
